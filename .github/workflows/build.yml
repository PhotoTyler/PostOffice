name: Build plugin and publish texture pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar + pack zip
        run: ./gradlew build --no-daemon
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp build/PostOffice-pack.zip site/
          sha1sum build/PostOffice-pack.zip | cut -d' ' -f1 > site/PostOffice-pack.sha1
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>PostOffice pack</title>
          <p>PostOffice resource pack: <a href="PostOffice-pack.zip">PostOffice-pack.zip</a>
          (<a href="PostOffice-pack.sha1">sha1</a>)</p>
          EOF
      # Some hosts (e.g. MineKeep) only let servers send packs from raw.githubusercontent.com,
      # so the zip is also force-pushed to the "pack" branch.
      - name: Publish pack to the pack branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir packbranch
          cp build/PostOffice-pack.zip site/PostOffice-pack.sha1 packbranch/
          cd packbranch
          git init -q -b pack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Texture pack from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pack
      - uses: actions/upload-artifact@v4
        with:
          name: PostOffice
          path: |
            build/libs/*.jar
            MysteryMail/build/libs/*.jar
            build/PostOffice-pack.zip
            build/PostOffice-bedrock.mcpack
            bedrock/geyser/postoffice_mappings.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            MysteryMail/build/libs/*.jar
            build/PostOffice-pack.zip
            build/PostOffice-bedrock.mcpack
            bedrock/geyser/postoffice_mappings.json

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
