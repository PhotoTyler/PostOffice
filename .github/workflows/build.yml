name: Build plugin and publish texture pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar + pack zip
        run: ./gradlew build --no-daemon
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp build/PostOffice-pack.zip site/
          sha1sum build/PostOffice-pack.zip | cut -d' ' -f1 > site/PostOffice-pack.sha1
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>PostOffice pack</title>
          <p>PostOffice resource pack: <a href="PostOffice-pack.zip">PostOffice-pack.zip</a>
          (<a href="PostOffice-pack.sha1">sha1</a>)</p>
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: PostOffice
          path: |
            build/libs/*.jar
            build/PostOffice-pack.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/PostOffice-pack.zip

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
